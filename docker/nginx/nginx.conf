server {
    listen 80;
    server_name _;

    # Static assets come from the slimbus/public bind-mount.
    root /var/www/html/public;
    index index.php;

    # Slim framework front-controller routing.
    # Try to serve real files first; anything else goes to index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM pass-through.
    location ~ \.php$ {
        fastcgi_pass            statbus:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include                 fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT  /var/www/html/public;
        fastcgi_read_timeout    120;
        fastcgi_buffer_size     16k;
        fastcgi_buffers         4 16k;
    }

    # Deny dot-files (.htaccess, .env, etc.)
    location ~ /\. {
        deny all;
    }
}
